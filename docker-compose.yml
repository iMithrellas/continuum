services:
  # Named volumes are created root-owned, but the image runs as uid 1000
  # (`spacetime`). This one-shot service fixes the ownership before the database
  # starts, so both the colony data and the CLI config are writable.
  init:
    image: clockworklabs/spacetime:v2.10.0
    container_name: continuum-spacetimedb-init
    user: root
    entrypoint: ["sh", "-c"]
    command:
      - >-
        chown -R 1000:1000
        /home/spacetime/.local/share/spacetime
        /home/spacetime/.config/spacetime
    volumes:
      - spacetimedb-data:/home/spacetime/.local/share/spacetime
      - spacetimedb-config:/home/spacetime/.config/spacetime
    restart: "no"

  spacetimedb:
    image: clockworklabs/spacetime:v2.10.0
    container_name: continuum-spacetimedb
    command: ["start", "--listen-addr", "0.0.0.0:3000"]
    depends_on:
      init:
        condition: service_completed_successfully
    ports:
      - "3000:3000"
    volumes:
      # Authoritative colony state. This is what makes the colony survive
      # container restarts and `docker compose down`.
      - spacetimedb-data:/home/spacetime/.local/share/spacetime
      # CLI config (server list + login identity), so the in-container
      # `spacetime` CLI keeps the same identity across restarts.
      - spacetimedb-config:/home/spacetime/.config/spacetime
      # Mounted so `docker compose exec spacetimedb spacetime publish -b /project/...`
      # can find the wasm binary built on the host.
      - ./backend/spacetimedb:/project
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "spacetime", "server", "ping", "local"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 10s

volumes:
  spacetimedb-data:
  spacetimedb-config:
