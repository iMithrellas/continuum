[package]
name = "continuum-module"
version = "0.1.0"
edition = "2021"
publish = false

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
spacetimedb = "2.10.0"
log = "0.4"

[features]
# Only owned, pure goal proposals use threads; WASM always uses the serial executor.
native-parallel-intents = []
# Private fault-injection artifact only; never enabled for deployment/bindings.
generation-test-probes = []

[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
panic = "abort"
